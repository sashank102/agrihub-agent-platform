[project]
name = "agrihub-agent-platform"
version = "0.1.0"
description = "A self-hosted multi-agent research platform."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.2.9",
    "langgraph>=1.1",
    "langgraph-checkpoint-postgres>=3.0.0",
    "langchain-openai>=0.3.28",
    "langchain-anthropic>=0.3.15",
    "langchain-mcp-adapters>=0.1.6",
    "langchain-deepseek>=0.1.2",
    "langchain-groq>=0.2.4",
    "tavily-python>=0.5.0",
    "duckduckgo-search>=3.0.0",
    "pydantic-settings>=2.10.1",
    "psycopg[binary,pool]>=3.2.0",
    "sqlalchemy[asyncio]>=2.0.41,<3.0",
    "alembic>=1.16.4,<2.0",
    "pytest",
    "langchain-google-vertexai>=2.0.25",
    "langchain-google-genai>=2.1.5",
    "mcp>=1.9.4",
    "langchain-aws>=0.2.28",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.34.3",
    "duckdb>=1.1",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "tenacity>=9.0",
    "aiolimiter>=1.2",
    "diskcache>=5.6",
]

[project.scripts]
agrihub-data = "agrihub_data.cli:main"

[project.optional-dependencies]
dev = ["mypy>=1.11.1", "ruff>=0.6.1"]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "agent_platform",
    "agent_platform.api",
    "agent_platform.api.routes",
    "agent_platform.core",
    "agent_platform.db",
    "agent_platform.db.models",
    "agent_platform.db.repositories",
    "agent_platform.services",
    "agrihub",
    "agrihub.nodes",
    "agrihub.prompts",
    "agrihub.tools",
    "agrihub_data",
    "agrihub_data.build",
    "agrihub_data.query",
    "open_deep_research",
    "tests",
]

[tool.setuptools.package-dir]
"open_deep_research" = "src/open_deep_research"
"agent_platform" = "src/agent_platform"
"agrihub" = "src/agrihub"
"agrihub_data" = "src/agrihub_data"
"tests" = "tests"

[tool.setuptools.package-data]
"*" = ["py.typed"]
"agrihub" = ["scoring_weights.yaml"]
"agrihub_data" = ["schema.sql", "registry/*.yaml"]
"agrihub_data.query" = ["traits/*.yaml"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    "UP035",
    "D417",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
"src/agent_platform/cli.py" = ["T201"]
"src/agrihub_data/cli.py" = ["T201"]
"src/agent_platform/__main__.py" = ["T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = false
warn_unused_ignores = false
disable_error_code = ["import-untyped", "no-any-return", "misc"]
exclude = ["src/open_deep_research", "tests"]

[tool.pytest.ini_options]
markers = [
    "postgres: requires TEST_DATABASE_URI and a live PostgreSQL server",
    "bundle: requires a built soybean bundle at $AGRIHUB_DATA_DIR/soybean/bundle.duckdb",
]
