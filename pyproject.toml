[project]
name = "agrihub-agent-platform"
version = "0.1.0"
description = "A self-hosted multi-agent research platform."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.2.9",
    "langgraph>=0.5.4",
    "langgraph-checkpoint-postgres>=3.0.0",
    "langchain-openai>=0.3.28",
    "langchain-anthropic>=0.3.15",
    "langchain-mcp-adapters>=0.1.6",
    "langchain-deepseek>=0.1.2",
    "langchain-groq>=0.2.4",
    "tavily-python>=0.5.0",
    "duckduckgo-search>=3.0.0",
    "pydantic-settings>=2.10.1",
    "psycopg[binary,pool]>=3.2.0",
    "sqlalchemy[asyncio]>=2.0.41,<3.0",
    "alembic>=1.16.4,<2.0",
    "pytest",
    "langgraph-cli[inmem]>=0.3.1",
    "langchain-google-vertexai>=2.0.25",
    "langchain-google-genai>=2.1.5",
    "mcp>=1.9.4",
    "langchain-aws>=0.2.28",
]

[project.optional-dependencies]
dev = ["mypy>=1.11.1", "ruff>=0.6.1"]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "agent_platform",
    "agent_platform.core",
    "agent_platform.db",
    "agent_platform.db.models",
    "agent_platform.db.repositories",
    "open_deep_research",
    "tests",
]

[tool.setuptools.package-dir]
"open_deep_research" = "src/open_deep_research"
"agent_platform" = "src/agent_platform"
"tests" = "tests"

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    "UP035",
    "D417",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
markers = [
    "postgres: requires TEST_DATABASE_URI and a live PostgreSQL server",
]
