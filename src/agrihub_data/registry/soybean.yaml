id_namespaces:
  - id: glyma
    pattern: '^Glyma\.\d{2}G\d{6}$'
    description: Wm82 a2/a4/a6 gene ids; the same id has different coordinates per assembly.
    example: Glyma.18G092200
  - id: glyma_transcript
    pattern: '^Glyma\.\d{2}G\d{6}\.\d+$'
    example: Glyma.18G092200.1
  - id: lis_full
    pattern: '^glyma\.Wm82\.gnm\d\.ann\d\.Glyma\.\d{2}G\d{6}$'
    description: LIS assembly-qualified gene id.
    example: glyma.Wm82.gnm4.ann1.Glyma.18G092200
  - id: ensembl
    pattern: '^GLYMA_\d{2}G\d{6}$'
    assembly: Wm82.a2.v1
    description: Ensembl Plants gene ids on Glycine_max_v2.1.
    example: GLYMA_18G092200
  - id: glyma1
    pattern: '^Glyma\d{2}g\d{5}$'
    assembly: Wm82.a1.v1
    description: Wm82.a1 gene ids, kept as synonyms.
    example: Glyma18g15421
  - id: ss
    pattern: '^ss\d+$'
    description: dbSNP submitted ids of SoySNP50K/180K/6K markers.
    example: ss715631025
  - id: barc_snp
    pattern: '^BARC_\d\.\d{2}_Gm\d{2}_\d+_[ACGTN]_[ACGTN]$'
    assembly: Wm82.a1.v1
    description: BARC SNP names; chromosome and position are on Wm82.a1.
    example: BARC_1.01_Gm01_24939_A_G
  - id: positional_snp
    pattern: '^S\d+_\d+$'
    description: Chromosome-position SNP ids used by GmHapMap and the sister team.
    example: S18_9263941
linkouts:
