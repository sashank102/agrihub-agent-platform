species: maize
scientific_name: Zea mays
common_name: maize
taxon_id: 4577
abbrev: zea
symbol_prefixes: [Zm]
canonical_assembly: Zm-B73-REFERENCE-NAM-5.0
default_window:
  flank_bp: 50000
  warn_above_bp: 50000
typical_ld_kb: 10
ld_note: >-
  LD decays within 1-10 kb in diverse maize and extends further only in elite
  inbred pools (Remington et al. 2001; Yan et al. 2009). A 250 kb flank is far
  wider than maize LD.
naming:
  canonical: "chr{number}"
  prefixes: [chr, Chr, Chromosome]
reference_assemblies:
  - species: arabidopsis
    assembly: TAIR10
assemblies:
  - id: Zm-B73-REFERENCE-NAM-5.0
    aliases: [B73v5, NAM-5.0, NAM5, AGPv5]
    description: B73 RefGen v5 from the NAM founder project; Zm00001eb gene ids.
    ncbi_accession: GCF_902167145.1
    chromosomes:
      - {name: chr1, number: 1, length: 308452471}
      - {name: chr2, number: 2, length: 243675191}
      - {name: chr3, number: 3, length: 238017767}
      - {name: chr4, number: 4, length: 250330460}
      - {name: chr5, number: 5, length: 226353449}
      - {name: chr6, number: 6, length: 181357234}
      - {name: chr7, number: 7, length: 185808916}
      - {name: chr8, number: 8, length: 182411202}
      - {name: chr9, number: 9, length: 163004744}
      - {name: chr10, number: 10, length: 152435371}
  - id: B73_RefGen_v4
    aliases: [B73v4, AGPv4, Zm-B73-REFERENCE-GRAMENE-4.0]
    description: >-
      B73 RefGen v4. No genes are kept on it: GWAS Atlas maize rows are lifted
      to v5 through the MaizeGDB chain file at build time, and v4 gene ids map
      to v5 through the MaizeGDB gene xref.
    ncbi_accession: GCF_000005005.2
    chromosomes:
      - {name: chr1, number: 1, length: 307041717}
      - {name: chr2, number: 2, length: 244442276}
      - {name: chr3, number: 3, length: 235667834}
      - {name: chr4, number: 4, length: 246994605}
      - {name: chr5, number: 5, length: 223902240}
      - {name: chr6, number: 6, length: 174033170}
      - {name: chr7, number: 7, length: 182381542}
      - {name: chr8, number: 8, length: 181122637}
      - {name: chr9, number: 9, length: 159769782}
      - {name: chr10, number: 10, length: 150982314}
id_namespaces:
  - id: zm_v5
    pattern: '^Zm00001eb\d{6}$'
    assembly: Zm-B73-REFERENCE-NAM-5.0
    description: B73 NAM-5.0 gene models (Zm00001eb.1), the canonical maize ids.
    example: Zm00001eb054440
  - id: zm_v5_transcript
    pattern: '^(Zm00001eb\d{6})_[TP]\d{3}$'
    kind: transcript
    assembly: Zm-B73-REFERENCE-NAM-5.0
    canonical: '\1'
    example: Zm00001eb054440_T001
  - id: zm_v4
    pattern: '^Zm00001d\d{6}$'
    assembly: B73_RefGen_v4
    description: B73 RefGen v4 gene ids; mapped to v5 through the MaizeGDB xref (one-to-many).
    example: Zm00001d027230
linkouts:
  - name: MaizeGDB
    template: "https://www.maizegdb.org/gene_center/gene/{gene_id}"
    id_namespace: zm_v5
  - name: Ensembl Plants
    template: "https://plants.ensembl.org/Zea_mays/Gene/Summary?g={gene_id}"
    id_namespace: zm_v5
  - name: PubMed
    kind: publication
    template: "https://pubmed.ncbi.nlm.nih.gov/{pmid}/"
