species: sorghum
scientific_name: Sorghum bicolor
common_name: sorghum
taxon_id: 4558
abbrev: sorbi
symbol_prefixes: [Sb]
canonical_assembly: Sorghum_bicolor_NCBIv3
default_window:
  flank_bp: 100000
typical_ld_kb: 50
ld_note: >-
  LD decays over roughly 10-150 kb depending on the panel and region
  (Morris et al. 2013).
naming:
  canonical: "Chr{number:02d}"
  prefixes: [Chr, chr, Chromosome, Sb, SBI-]
reference_assemblies:
  - species: arabidopsis
    assembly: TAIR10
assemblies:
  - id: Sorghum_bicolor_NCBIv3
    aliases: [NCBIv3, BTx623_v3, Sbicolor_v3, v3]
    description: BTx623 v3; the Sorghum QTL Atlas and most GWAS use it.
    ncbi_accession: GCF_000003195.3
    chromosomes:
      - {name: Chr01, number: 1, length: 80884392}
      - {name: Chr02, number: 2, length: 77742459}
      - {name: Chr03, number: 3, length: 74386277}
      - {name: Chr04, number: 4, length: 68658214}
      - {name: Chr05, number: 5, length: 71854669}
      - {name: Chr06, number: 6, length: 61277060}
      - {name: Chr07, number: 7, length: 65505356}
      - {name: Chr08, number: 8, length: 62686529}
      - {name: Chr09, number: 9, length: 59416394}
      - {name: Chr10, number: 10, length: 61233695}
id_namespaces:
  - id: sorbi
    pattern: '^SORBI_3\d{3}G\d{6}$'
    assembly: Sorghum_bicolor_NCBIv3
    description: Ensembl/SorghumBase NCBIv3 gene ids, the canonical sorghum ids.
    example: SORBI_3007G163800
  - id: sobic
    pattern: '^Sobic\.(\d{3})G(\d{6})$'
    assembly: Sorghum_bicolor_NCBIv3
    canonical: 'SORBI_3\1G\2'
    description: >-
      Phytozome v3.1.1 ids. Sobic.CCCGNNNNNN is SORBI_3CCCGNNNNNN; the
      rewrite was checked on the eight Grant et al. 2023 Ma/Dw genes
      (identical v3 coordinates) and on GWAS Atlas reported genes (distance
      to the reported SNP, see the gwas_atlas build stats).
    example: Sobic.007G163800
  - id: sorbi_transcript
    pattern: '^(SORBI_3\d{3}G\d{6})\.\d+$'
    kind: transcript
    assembly: Sorghum_bicolor_NCBIv3
    canonical: '\1'
    example: SORBI_3007G163800.1
  - id: sobic_transcript
    pattern: '^Sobic\.(\d{3})G(\d{6})\.\d+(?:\.p)?$'
    kind: transcript
    assembly: Sorghum_bicolor_NCBIv3
    canonical: 'SORBI_3\1G\2'
    example: Sobic.007G163800.1
linkouts:
  - name: SorghumBase
    template: "https://www.sorghumbase.org/?idList={gene_id}"
    id_namespace: sorbi
  - name: Ensembl Plants
    template: "https://plants.ensembl.org/Sorghum_bicolor/Gene/Summary?g={gene_id}"
    id_namespace: sorbi
  - name: PubMed
    kind: publication
    template: "https://pubmed.ncbi.nlm.nih.gov/{pmid}/"
sources:
  - id: sorghumbase_gene_models
    name: SorghumBase release 11 NCBIv3 gene models
    tier: core
    version: SorghumBase release-11 (Sorghum_bicolor_NCBIv3)
    license: SorghumBase data are freely available; cite Gladman et al. 2022
    homepage: http://ftp.sorghumbase.org/release-11/
    citation: McCormick et al. 2018, Plant J 93:338-354; Gladman et al. 2022, Front Plant Sci 13:844510
    assemblies: [Sorghum_bicolor_NCBIv3]
    parser: gff_gene_models
    params: {source_db: SorghumBase}
    notes: The v5.1 GFF of the same release is on another assembly and is not loaded.
    files:
      - url: http://ftp.sorghumbase.org/release-11/gff3/sorghum_bicolor/Sorghum_bicolor.Sorghum_bicolor_NCBIv3.gff3.gz
        path: Sorghum_bicolor.Sorghum_bicolor_NCBIv3.gff3.gz
        sha256: 184158868ae64903dc15346cccbcfec1fc7dd5fca72d71b661e74201f7070817
        size: 5768570
  - id: phytozome_annotation_info
    name: Phytozome Sbicolor v3.1.1 annotation_info (Pfam, PANTHER, GO, best hits)
    tier: core
    version: Sbicolor_454_v3.1.1
    license: JGI data usage policy (Phytozome); login required
    homepage: https://phytozome-next.jgi.doe.gov/info/Sbicolor_v3_1_1
    citation: McCormick et al. 2018, Plant J 93:338-354
    assemblies: [Sorghum_bicolor_NCBIv3]
    parser: phytozome_annotation_info
    notes: >-
      Manual download: sign in to Phytozome (JGI account or ORCID), download
      Sbicolor_454_v3.1.1.annotation_info.txt and save it as
      raw/phytozome_annotation_info/Sbicolor_454_v3.1.1.annotation_info.txt,
      then fetch and build again. Without it sorghum genes have no domain or
      best-hit annotation.
    files:
      - url: https://phytozome-next.jgi.doe.gov/info/Sbicolor_v3_1_1
        path: Sbicolor_454_v3.1.1.annotation_info.txt
        manual: true
  - id: sorghum_qtl_atlas
    name: Sorghum QTL Atlas (QTL, GWAS loci and major effect genes, v3 coordinates)
    tier: core
    version: Sorghum QTL Atlas export (query_qtl_atlas SorghumQtlAtlas.db)
    license: See https://aussorgm.org.au/sorghum-qtl-atlas/ (Mace et al. 2019)
    homepage: https://aussorgm.org.au/sorghum-qtl-atlas/
    citation: Mace et al. 2019, Theor Appl Genet 132:751-766
    assemblies: [Sorghum_bicolor_NCBIv3]
    parser: sorghum_qtl_atlas
    notes: >-
      Manual export. On 2026-10-03 the Atlas search page served only a contact
      form (reCAPTCHA), so no export could be scripted. Export the trait tables
      as Excel, build SorghumQtlAtlas.db with github.com/jlboat/query_qtl_atlas
      (generate_atlas_database.py), save it as
      raw/sorghum_qtl_atlas/SorghumQtlAtlas.db and rebuild; a CSV/TSV export
      with the same columns also works.
    files:
      - url: https://aussorgm.org.au/sorghum-qtl-atlas/search/
        path: SorghumQtlAtlas.db
        manual: true
