    name: RAP-DB IRGSP-1.0 representative gene models
    tier: core
    version: IRGSP-1.0 representative 2026-02-05
    license: RAP-DB data are free to use with citation (Sakai et al. 2013); see https://rapdb.dna.naro.go.jp/disclaimer.html
    homepage: https://rapdb.dna.naro.go.jp/download/irgsp1.html
    citation: Sakai et al. 2013, Plant Cell Physiol 54:e6; Kawahara et al. 2013, Rice 6:4
    assemblies: [IRGSP-1.0]
    parser: gff_gene_models
    params:
