species: rice
scientific_name: Oryza sativa
common_name: rice
taxon_id: 4530
abbrev: orysa
symbol_prefixes: [Os]
canonical_assembly: IRGSP-1.0
default_window:
  flank_bp: 150000
typical_ld_kb: 150
ld_note: >-
  LD decays over about 75 kb in indica, 150 kb in tropical japonica and up to
  500 kb in temperate japonica (Mather et al. 2007).
naming:
  canonical: "chr{number:02d}"
  prefixes: [chr, Chr, Os, Chromosome]
reference_assemblies:
  - species: arabidopsis
    assembly: TAIR10
assemblies:
  - id: IRGSP-1.0
    aliases: [IRGSP1, Os-Nipponbare-Reference-IRGSP-1.0, MSU7]
    description: Nipponbare IRGSP-1.0; RAP-DB ids are primary and MSU7 LOC_Os ids share the pseudomolecules.
    ncbi_accession: GCF_001433935.1
    chromosomes:
      - {name: chr01, number: 1, length: 43270923}
      - {name: chr02, number: 2, length: 35937250}
      - {name: chr03, number: 3, length: 36413819}
      - {name: chr04, number: 4, length: 35502694}
      - {name: chr05, number: 5, length: 29958434}
      - {name: chr06, number: 6, length: 31248787}
      - {name: chr07, number: 7, length: 29697621}
      - {name: chr08, number: 8, length: 28443022}
      - {name: chr09, number: 9, length: 23012720}
      - {name: chr10, number: 10, length: 23207287}
      - {name: chr11, number: 11, length: 29021106}
      - {name: chr12, number: 12, length: 27531856}
      - {name: chrMt, length: 490520, aliases: [Mt, ChrM, chrM, MT]}
      - {name: chrPt, length: 134525, aliases: [Pt, ChrC, chrC, Pltd]}
id_namespaces:
  - id: rap
    pattern: '^Os\d{2}g\d{7}$'
    assembly: IRGSP-1.0
    description: RAP-DB locus ids, the canonical rice gene ids.
    example: Os01g0883800
  - id: rap_transcript
    pattern: '^Os(\d{2})t(\d{7})-\d{2}$'
    kind: transcript
    assembly: IRGSP-1.0
    canonical: 'Os\1g\2'
    description: RAP-DB transcript ids; the locus id swaps t for g and drops the suffix.
    example: Os01t0883800-02
  - id: msu
    pattern: '^LOC_Os\d{2}g\d{5}$'
    assembly: IRGSP-1.0
    description: >-
      MSU rice genome annotation release 7 loci on the same pseudomolecules;
      mapped to RAP loci through the RAP-MSU table (many-to-many).
    example: LOC_Os01g66100
  - id: msu_transcript
    pattern: '^(LOC_Os\d{2}g\d{5})\.\d+$'
    kind: transcript
    assembly: IRGSP-1.0
    canonical: '\1'
    example: LOC_Os01g66100.1
linkouts:
  - name: RAP-DB
    template: "https://rapdb.dna.naro.go.jp/locus/?name={gene_id}"
    id_namespace: rap
  - name: Ensembl Plants
    template: "https://plants.ensembl.org/Oryza_sativa/Gene/Summary?g={gene_id}"
    id_namespace: rap
  - name: PubMed
    kind: publication
    template: "https://pubmed.ncbi.nlm.nih.gov/{pmid}/"
sources:
