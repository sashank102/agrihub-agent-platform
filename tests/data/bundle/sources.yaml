  - id: lis_qtl
    name: LIS QTL fixture
    tier: core
    version: LIS datastore qtl
    rolling: true
    license: Open
    assemblies: [Wm82.a2.v1]
    parser: lis_qtl
    collection:
      listing_url: "{base}/lis_qtl/"
      entry_pattern: '[^/]+\.qtl\.[^/]+'
      files:
        - {url: "{base}/lis_qtl/{entry}/glyma.{entry}.qtl.tsv.gz", path: "{entry}/glyma.{entry}.qtl.tsv.gz"}
        - {url: "{base}/lis_qtl/{entry}/glyma.{entry}.qtlmrk.tsv.gz", path: "{entry}/glyma.{entry}.qtlmrk.tsv.gz", optional: true}
        - {url: "{base}/lis_qtl/{entry}/glyma.{entry}.obo.tsv.gz", path: "{entry}/glyma.{entry}.obo.tsv.gz", optional: true}
        - {url: "{base}/lis_qtl/{entry}/README.{entry}.yml", path: "{entry}/README.{entry}.yml", optional: true}
  - id: lis_gwas
    name: LIS GWAS fixture
    tier: core
    version: LIS datastore gwas
    rolling: true
    license: Open
    assemblies: [Wm82.a2.v1]
    parser: lis_gwas
    collection:
      listing_url: "{base}/lis_gwas/"
      entry_pattern: '[^/]+\.gwas\.[^/]+'
      files:
        - {url: "{base}/lis_gwas/{entry}/glyma.{entry}.result.tsv.gz", path: "{entry}/glyma.{entry}.result.tsv.gz"}
        - {url: "{base}/lis_gwas/{entry}/glyma.{entry}.obo.tsv.gz", path: "{entry}/glyma.{entry}.obo.tsv.gz", optional: true}
        - {url: "{base}/lis_gwas/{entry}/README.{entry}.yml", path: "{entry}/README.{entry}.yml", optional: true}
