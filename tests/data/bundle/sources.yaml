      - {url: "{base}/lis_wm82_a4/glyma.Wm82.gnm4.ann1.T8TQ.info_annot.txt.gz", path: glyma.Wm82.gnm4.ann1.T8TQ.info_annot.txt.gz}
  - id: lis_wm82_a6
