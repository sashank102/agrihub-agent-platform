# Fixture sources for the soybean registry. {base} is the local test server.
# Files under files/<source_id>/ are served gzipped when the path ends in .gz.
sources:
  - id: lis_wm82_a2
    name: LIS Wm82.a2.v1 fixture
    tier: core
    version: Wm82.gnm2.ann1.RVB6
    license: Open
    assemblies: [Wm82.a2.v1]
    parser: lis_annotation
    files:
      - {url: "{base}/lis_wm82_a2/glyma.Wm82.gnm2.ann1.RVB6.gene_models_main.gff3.gz", path: glyma.Wm82.gnm2.ann1.RVB6.gene_models_main.gff3.gz}
      - {url: "{base}/lis_wm82_a2/glyma.Wm82.gnm2.ann1.RVB6.info_annot.txt.gz", path: glyma.Wm82.gnm2.ann1.RVB6.info_annot.txt.gz}
      - {url: "{base}/lis_wm82_a2/glyma.Wm82.gnm2.ann1.RVB6.info_gene_annot.txt.gz", path: glyma.Wm82.gnm2.ann1.RVB6.info_gene_annot.txt.gz}
      - {url: "{base}/lis_wm82_a2/glyma.Wm82.gnm2.ann1.RVB6.synonym.txt.gz", path: glyma.Wm82.gnm2.ann1.RVB6.synonym.txt.gz}
      - {url: "{base}/lis_wm82_a2/glyma.Wm82.gnm2.ann1.RVB6.markers.gff3.gz", path: glyma.Wm82.gnm2.ann1.RVB6.markers.gff3.gz}
