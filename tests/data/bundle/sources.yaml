  - id: lis_pangenes
    name: LIS pangene fixture
    tier: core
    version: Glycine.pan5.MKRS
    license: Open
    assemblies: [Wm82.a1.v1, Wm82.a2.v1, Wm82.a4.v1, Wm82.a6.v1]
